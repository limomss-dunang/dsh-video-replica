  // 注意 jsx/jsxs 的第三个参数是 key：要还原成 React 的 key，否则 key 会被当成孩子。
  window.__ModuleLoader__ = {
    load({ id, factory }) {
      const runtime = {
        jsx(type, props, key) {
          const { children, ...rest } = props || {}
          const finalProps = key === undefined ? rest : { ...rest, key }
          if (children === undefined) return React.createElement(type, finalProps)
          return Array.isArray(children)
            ? React.createElement(type, finalProps, ...children)
            : React.createElement(type, finalProps, children)
        },
        jsxs(type, props, key) { return runtime.jsx(type, props, key) },
        Fragment: React.Fragment,
      }
      window.__pluginExports = factory(name => {
        if (name === 'react') return React
        if (name === 'react-dom/client') return ReactDOM
        if (name === 'react/jsx-runtime') return runtime
        throw new Error('unexpected require: ' + name)
      })
    },
  }

  function placeholder(seed, label) {
    const canvas = document.createElement('canvas')

    canvas.height = 480
    const ctx = canvas.getContext('2d')

    ctx.fillStyle = bg
    ctx.fillRect(0, 0, 360, 480)
    ctx.fillStyle = fg
    ctx.globalAlpha = 0.22
    ctx.beginPath()
    ctx.arc(180 + (seed % 3) * 20, 230, 120, 0, Math.PI * 2)
    ctx.fill()
    ctx.globalAlpha = 1
    ctx.fillStyle = fg
    ctx.fillRect(120, 300, 120, 26)

    return canvas.toDataURL('image/png')

<script>
  const { apply } = window.__pluginExports
  const sections = []
  const ctx = {
    effect: run => { const dispose = run(); return typeof dispose === 'function' ? dispose : () => {} },
    get: () => undefined,
    slots: {
      inject: (_name, register) => register(),
      register: (options, component) => { sections.push({ options, component }); return () => {} },
    },
    locale: { getLocale: () => ({ active: 'zh-CN' }), subscribe: () => () => {} },
  }
  apply(ctx)

  // 打开工作台并切到指定步骤
  requestAnimationFrame(() => {
    document.querySelector('[data-dvr-entry]')?.click()
    setTimeout(() => {
      const stepMap = { input: null, analyze: 'analyze', rewrite: 'rewrite', match: 'match', generate: 'generate', compose: 'compose' }
      const wanted = stepMap[stepParam]
      if (stepParam === 'settings') {
        // 直接把设置页渲染到中栏（预览专用）
        const view = document.querySelector('[data-dvr-view]')
        view.innerHTML = ''
        const host = document.createElement('div')
        host.className = 'vr-app'
        host.innerHTML = '<div class="vr-main" style="padding:18px"><div class="vr-stage" id="settings-host"></div></div>'
        view.append(host)
        ReactDOM.createRoot(document.getElementById('settings-host')).render(React.createElement(sections[0].component))
        return
      }
      // 先选中历史任务（会按当前进度自动选步骤），再切到目标步骤
      if (stepParam !== 'input') document.querySelector('.vr-run')?.click()
      setTimeout(() => {
        if (!wanted) return
        const labels = { analyze: 'AI 拆解', rewrite: 'AI 仿写', match: '参考图匹配', generate: 'AI 生成视频', compose: '合成成片' }
        const steps = [...document.querySelectorAll('.vr-step')]
        steps.find(step => step.textContent.includes(labels[wanted]))?.click()
      }, 250)
    }, 400)
  })
</script>
</body>
</html>
