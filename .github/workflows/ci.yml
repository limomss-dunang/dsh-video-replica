name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # 用静态构建，避免 apt-get 在 runner 上偶发卡死（曾卡 15 分钟以上）。
      - name: Install ffmpeg (static build)
        run: |
          sudo apt-get remove -y ffmpeg >/dev/null 2>&1 || true
          curl -fsSL --retry 3 --max-time 180 -o /tmp/ffmpeg.tar.xz https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz
          mkdir -p /tmp/ffmpeg && tar -xf /tmp/ffmpeg.tar.xz -C /tmp/ffmpeg --strip-components=1
          sudo mv /tmp/ffmpeg/ffmpeg /tmp/ffmpeg/ffprobe /usr/local/bin/
          ffmpeg -version | head -1
          ffprobe -version | head -1

      - name: Install dependencies (also builds lib/ via prepare)
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Client smoke
        run: npm run smoke:client

      - name: Host smoke (real ffmpeg + mock model gateway)
        run: npm run smoke:host

  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies (also builds lib/ via prepare)
        run: npm install

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright Chromium
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      # 中文字体只影响截图观感，装不上也继续（避免 apt 卡死整条流水线）。
      - name: Install CJK font (best effort)
        continue-on-error: true
        run: |
          timeout 120 sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update || true
          timeout 180 sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y fonts-noto-cjk || true

      - name: Render workbench screenshots (real client bundle)
        run: python scripts/preview/shots.py

      - name: Check button/select contrast under broken host tokens
        run: python scripts/preview/verify-buttons.py

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-screenshots
          path: output/preview
          if-no-files-found: warn
