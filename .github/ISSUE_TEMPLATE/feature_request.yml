name: Feature request / 功能建议
description: 提一个新功能或改进
title: "[feat] "
labels: ["enhancement"]
body:
  - type: textarea
    id: scenario
    attributes:
      label: 使用场景
      description: 你在做什么任务时卡住了，或者希望省掉哪一步手工操作
      placeholder: 例如：我想把成片直接发到某个平台，现在要手动下载再上传
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的行为
      description: 你希望插件怎么表现（界面位置、输入输出、默认值）
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 你现在的替代做法
      description: 现在是怎么绕过这个缺口的，或者你考虑过的其它方案
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: 涉及范围
      options:
        - 解析下载
        - AI 拆解 / 仿写（提示词）
        - 参考图 / 视频生成
        - 合成成片（配音 / 字幕 / BGM）
        - 工作台界面
        - 设置与模型接入
        - 文档 / 开发体验
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 已搜索过现有 issue 与 README，确认不是已有功能
          required: true
